on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'infra'
        type: choice
        options:
          - infra
          - network
          - full


jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
        - uses: actions/checkout@v4
        - name: Setup testing environment
          run: |
            echo "Setting up test infrastructure for ${{ inputs.test_type }}"
            cd testing
            mask --version || echo "mask command not available"
        
        - name: Run ${{ inputs.test_type }} tests
          run: |
            cd testing
            echo "Running ${{ inputs.test_type }} test validation"
            mask testing perform
            
        - name: Cleanup
          if: always()
          run: |
            echo "Test cleanup completed"
